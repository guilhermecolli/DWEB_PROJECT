<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio Pedro</title>
    <link rel="stylesheet" href="css/pagina-exemplo.css">
    <link rel="shortcut icon" href="Icones/image.png">
</head>
<body>
    <main>
        <section class="firstsection">
            <img id="cabeca-img" src="" alt="foto-dev">
            <p class="titulo1" id="cabeca-titulo"></p>
            <p class="subtitulo1"><strong id="cabeca-subtitulo"></strong></p>
            <button class="botao1" id="cabeca-btn"></button>
        </section>

        <section class="secondsection">
            <div class="coluna-texto">
                <p class="titulo2" id="sobre-titulo"></p>
                <p class="subtitulo2" id="sobre-cargo"></p>
                <p class="texto1" id="sobre-desc"></p>
                
                <div class="botoes-container">
                    <button class="botao2" id="sobre-btn"></button> 
                    <button class="instagram"></button>
                    <button class="linkedin"></button>
                </div>
            </div>
            <div class="coluna-imagem">
                <img id="sobre-img" src="" alt="foto-dev">
            </div>
        </section>

        <section class="thirdsection">
            <p class="titulo3">Últimos Projetos</p>
            <div class="linha-imagens" id="lista-projetos">
            </div>
        </section>

        <footer>
            <div class="footer-principal">
                <div class="coluna-contatos">
                    <h3>Entre em contato comigo</h3>
                    <p id="footer-email"></p>
                    <p id="footer-tel"></p>
                </div>

                <div class="coluna-redes">
                    <h3>Acompanhe o meu trabalho!</h3>
                    <div class="icones">
                        <button class="instagram"></button>
                        <button class="linkedin"></button>
                        <button class="github"></button>
                    </div>
                </div>
            </div>
            <div class="footer-abaixo">
                <p id="footer-copy"></p>
            </div>
        </footer>
    </main>

    <script src="js/montador.js"></script>
</body>
</html>
