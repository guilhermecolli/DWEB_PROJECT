<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="shortcut icon" href="Icones/image.png">
</head>
<body>
    <main>
        <!-- Título da página -->
        <section>
            <h1>BEM-VINDO AO <span class="cortitulo">DEPLOY ME</span>!</h1>
        </section>
        <!-- Quadro de login e cadastro da página inicial -->
         <section class="container-login-cadastro">
        
            <!-- Lado esquerdo (login) do quadro -->
            <div class="coluna-form" id="login">
                <h2>Login</h2>
                <form action="#">
                    <input type="email" id="email-login" placeholder="Email: usuario.cefet@gmail.com" required>
                    <input type="password" id="password-login" placeholder="Senha: ••••••••••••" required>
                    <input type="submit" name="acao-login" value="Entrar" onclick="return login();">
                    <!--<button type="submit" class="btn">Entrar</button>-->
                </form>
            </div>

            <!-- Lado direito (Cadastro) do quadro -->
            <div class="coluna-form" id="cadastro">
                <h2>Cadastro</h2>
                <form action="paginainicial.html" id="cadastro">
                    <input type="text" id="name" placeholder="Nome: Usuário do Deploy Me" required>
                    <input type="email" id="email-cadastro" placeholder="Email: usuario.cefet@gmail.com" required>
                    <input type="password" id="password-cadastro" placeholder="Senha: ••••••••••••" required>
                    <input type="password" id="password-confirmation" placeholder="Confirmar senha: ••••••••••••" required>
                    <input type="submit" name="acao-cadastro" value="Cadastrar">
                    <!--<button type="submit" class="btn">Cadastrar</button>-->
                </form>
            </div>

         </section>
         <script src="js/cadastro.js"></script>
    </main>
</body>
</html>
